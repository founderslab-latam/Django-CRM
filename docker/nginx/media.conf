# Serves the PUBLIC media subtrees only — organisation and invoice-template
# logos. These end up on invoices, estimates and the customer portal, so they
# are meant to be fetched without a credential.
#
# Attachments (`attachments/`), documents and comment files are deliberately
# NOT mounted into this container: MEDIA_ROOT is otherwise a mix of tenants'
# uploads, and a blanket `/media/` server would be a cross-tenant read hole
# (see the note in backend/crm/urls.py). They stay behind Django's
# permission-checked /api/(documents|attachments)/<id>/download/ endpoints.

server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /media/ {
        alias /srv/media/;
        try_files $uri =404;          # a path with no mounted file -> 404
        autoindex off;               # never list a directory
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff";
        # These images are embedded in emails and rendered on the customer
        # portal, both cross-origin. Without this, a browser fetching the logo
        # from another origin (Gmail's image proxy, the portal SPA) may refuse
        # it under Cross-Origin-Resource-Policy: same-origin defaults.
        add_header Cross-Origin-Resource-Policy "cross-origin";
    }

    location / {
        return 404;
    }
}
